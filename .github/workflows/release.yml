name: Build & Release Quill APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.json'
      - 'README.md'
      - 'docs/**'
      - 'ci-build.log'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Release APK
        id: build_apk
        run: |
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1 || BUILD_FAILED=1
          cat build.log | tail -n 120
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "Gradle build failed! Exporting ci-build.log..."
            cp build.log ci-build.log
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add ci-build.log
            git commit -m "ci: capture build failure log [skip ci]" || true
            git push origin main || true
            exit 1
          fi

      - name: Sign & Align Release APK (v1, v2, v3 schemes)
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found unsigned APK at: $APK_PATH"

          VERSION_NAME=$(grep "versionName = " app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          OUTPUT_APK="Quill-v${VERSION_NAME}.apk"

          # Find Android SDK Build Tools (zipalign & apksigner)
          BUILD_TOOLS=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools -maxdepth 1 -name "3*" | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          # 1. 4-byte alignment
          echo "Running zipalign..."
          "$ZIPALIGN" -f -v -p 4 "$APK_PATH" aligned.apk

          # 2. Sign with APK Signature Scheme v1, v2, and v3
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using repository release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            "$APKSIGNER" sign --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUTPUT_APK" \
              aligned.apk
            rm -f release.keystore
          else
            echo "Generating signing key with APK Signature Scheme v1, v2 & v3..."
            keytool -genkeypair -v -keystore ci.keystore -alias quill-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "quillpass123" -keypass "quillpass123" \
              -dname "CN=Quill App, O=Quill, C=US"
            "$APKSIGNER" sign --ks ci.keystore \
              --ks-pass "pass:quillpass123" \
              --key-pass "pass:quillpass123" \
              --ks-key-alias quill-ci \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUTPUT_APK" \
              aligned.apk
            rm -f ci.keystore
          fi

          # 3. Verify signature schemes
          echo "Verifying APK signatures with apksigner verify..."
          "$APKSIGNER" verify --verbose "$OUTPUT_APK"

          # 4. Compute SHA-256 checksum
          SHA256=$(sha256sum "$OUTPUT_APK" | cut -d ' ' -f 1)
          echo "OUTPUT_APK=$OUTPUT_APK" >> $GITHUB_ENV
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "Computed SHA-256: $SHA256"

      - name: Update version.json
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 -c "
          import json, datetime
          with open('version.json', 'r') as f:
              data = json.load(f)
          data['latestVersionCode'] = 2
          data['latestVersionName'] = '${{ env.VERSION_NAME }}'
          data['sha256'] = '${{ env.SHA256 }}'
          data['apkUrl'] = 'https://github.com/${{ env.GITHUB_REPO }}/releases/download/v${{ env.VERSION_NAME }}/${{ env.OUTPUT_APK }}'
          data['updatedAt'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          cat version.json

      - name: Commit version.json updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(release): update version.json for v${{ env.VERSION_NAME }} [skip ci]"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Quill v${{ env.VERSION_NAME }}"
          files: ${{ env.OUTPUT_APK }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
